server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS (127.0.0.11) so this resolves zoidev-contact at
  # request time instead of failing to start if that container isn't up
  # yet when nginx boots.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Contact form backend (see api/main.py) — proxies /api/contacto to the
  # zoidev-contact container. Never exposed directly, only through here.
  location /api/ {
    set $contact_upstream http://zoidev-contact:8090/;
    proxy_pass $contact_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
  }

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript application/javascript
    application/json image/svg+xml font/woff2;

  # cache shared assets aggressively, html lightly
  location /shared/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }

  # SPA-style fallback (harmless for the single-page landing too)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # tiny security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
