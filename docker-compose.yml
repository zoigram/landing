# docker-compose for the VPS / Portainer. Pulls prebuilt images from GHCR —
# .github/workflows/docker-build.yml builds + pushes both images on every
# push to main, then pings Portainer's stack webhook so it pulls and
# redeploys automatically. No git clone, no local build here, so a plain
# `up -d` is always enough (no --no-cache rebuild dance).
#
# For local development instead, see docker-compose.override.yml.
#
# Contact form (see api/main.py): set RESEND_API_KEY / RESEND_FROM — as
# stack environment variables in Portainer, or in a .env next to this file
# for plain `docker compose`.

services:
  zoidev-app:
    image: ghcr.io/zoigram/landing:latest
    pull_policy: always
    container_name: zoidev-app
    restart: always
    depends_on:
      - zoidev-contact
    # Pangolin's reverse proxy reaches us by container name on this network.
    # Configure the resource in Pangolin to point at  http://zoidev-app:80
    # nginx also needs `default` to resolve zoidev-contact for /api/ (see nginx.conf).
    networks:
      - pangolin
      - default

  zoidev-contact:
    image: ghcr.io/zoigram/landing-contact:latest
    pull_policy: always
    container_name: zoidev-contact
    restart: always
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-zoidev <noreply@notifications.zoidev.com>}
      CONTACT_TO: ${CONTACT_TO:-contacto@zoidev.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://zoidev.com}
    # Only reached internally by nginx (see nginx.conf) — never joins
    # `pangolin`, so it's not reachable from outside this compose stack.
    networks:
      - default

networks:
  pangolin:
    external: true
